name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartrent
          POSTGRES_PASSWORD: smartrent
          POSTGRES_DB: smartrentboss
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartrent -d smartrentboss"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://smartrent:smartrent@localhost:5432/smartrentboss?schema=public
      AUTH_SECRET: ci-only-secret-not-used-for-real-sessions
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx next typegen
      - run: npx tsc --noEmit
