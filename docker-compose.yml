services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartrent
      POSTGRES_PASSWORD: smartrent
      POSTGRES_DB: smartrentboss
    ports:
      - "5432:5432"
    volumes:
      - smartrentboss_pg:/var/lib/postgresql/data

volumes:
  smartrentboss_pg:
